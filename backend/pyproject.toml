[project]
name = "enset-assistant-backend"
version = "0.1.0"
description = "Backend FastAPI + LangGraph + RAG pour Mourchid — assistant académique ENSET Mohammedia"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "pypdf>=5.0.0",
    "numpy>=1.26.0",
    "mcp>=1.2.0",
    "chromadb>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "langgraph-cli[inmem]>=0.1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
